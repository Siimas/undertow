name: release
on:
  push:
    branches: [main] # builds and tests, and keeps the build cache warm for releases
    tags: ["v*"]     # also publishes the installers
  pull_request:      # builds and tests proposed changes; never publishes

permissions:
  contents: read

jobs:
  # Builds third-party code (JUCE), so this job gets no write access to the repo.
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            file: Undertow-macOS-Installer.pkg
          - os: windows-latest
            file: Undertow-Windows-Installer.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compiled JUCE is reused between runs; only Undertow's own files rebuild.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      # Never ship anything left over from a cached run: the plugin itself is always relinked.
      - run: rm -rf build/Undertow_artefacts
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

      - name: Mac installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3
          cp -R build/Undertow_artefacts/Release/VST3/Undertow.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          pkgbuild --root pkgroot --install-location / --identifier com.flplugins.undertow \
            --version "${GITHUB_REF_NAME#v}" "${{ matrix.file }}"

      - name: Windows installer
        if: runner.os == 'Windows'
        run: iscc installer.iss  # Inno Setup ships with the runner image

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  # Only this job can write to the repo, and it runs nothing but gh.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Undertow-macOS-Installer.pkg Undertow-Windows-Installer.exe --generate-notes
