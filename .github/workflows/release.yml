name: release
on:
  push:
    branches: [main] # builds and tests, and keeps the build cache warm for releases
    tags: ["v*"]     # also publishes the installers

permissions:
  contents: read

jobs:
  # Builds third-party code (JUCE), so this job gets no write access to the repo.
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            file: Pump-macOS-Installer.pkg
          - os: windows-latest
            file: Pump-Windows-Installer.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Compiled JUCE is reused between runs; only Pump's own files rebuild.
      - uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      # Never ship anything left over from a cached run: the plugin itself is always relinked.
      - run: rm -rf build/Pump_artefacts
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

      - name: Mac installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3
          cp -R build/Pump_artefacts/Release/VST3/Pump.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          pkgbuild --root pkgroot --install-location / --identifier com.flplugins.pump \
            --version "${GITHUB_REF_NAME#v}" "${{ matrix.file }}"

      - name: Windows installer
        if: runner.os == 'Windows'
        run: iscc installer.iss  # Inno Setup ships with the runner image

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  # Only this job can write to the repo, and it runs nothing but gh.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Pump-macOS-Installer.pkg Pump-Windows-Installer.exe --generate-notes
