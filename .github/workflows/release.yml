name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            file: Pump-macOS-Installer.pkg
          - os: windows-latest
            file: Pump-Windows-Installer.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # build steps run third-party code; keep the repo token away from them
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

      - name: Mac installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3
          cp -R build/Pump_artefacts/Release/VST3/Pump.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          pkgbuild --root pkgroot --install-location / --identifier com.flplugins.pump \
            --version "${GITHUB_REF_NAME#v}" "${{ matrix.file }}"

      - name: Windows installer
        if: runner.os == 'Windows'
        run: iscc installer.iss  # Inno Setup ships with the runner image

      # Token only on the release step, not visible to the build
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.file }}" --clobber
